# Minimal tmux config for remote SSH — no key remaps (default prefix Ctrl-b).
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm*:Tc"
set -sg escape-time 0
set -g mouse on
set -g history-limit 10000

# --- Tab (window) UI ---
set -g base-index 1                 # windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on          # close a window → no gaps in numbering

set -g status-position bottom       # tabs at bottom (set to "top" to move them up)
set -g status-justify left

# tab look: padded, active one highlighted
setw -g window-status-format         " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style  "fg=black,bg=cyan,bold"
setw -g window-status-style          "fg=white,bg=default"
setw -g window-status-separator      ""

# --- Help bar: static keybind cheat sheet (stock Ctrl-b, no modes on remote) ---
set -g status 2
set -g status-format[1] "#[align=centre,fg=colour255,bg=colour235]Ctrl-b:  % split-v   \" split-h   c new-win   n/p prev/next   & kill-win   , rename   z zoom   [ copy   w list   d detach"
